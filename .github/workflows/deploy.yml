name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: petivo-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Runtime config (contact form)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
          CONTACT_FROM: ${{ secrets.CONTACT_FROM }}
        run: |
          umask 077
          : > .next/standalone/.env.production
          if [ -n "$RESEND_API_KEY" ]; then echo "RESEND_API_KEY=$RESEND_API_KEY" >> .next/standalone/.env.production; fi
          if [ -n "$CONTACT_TO" ]; then echo "CONTACT_TO=$CONTACT_TO" >> .next/standalone/.env.production; fi
          if [ -n "$CONTACT_FROM" ]; then echo "CONTACT_FROM=$CONTACT_FROM" >> .next/standalone/.env.production; fi

      - name: Package standalone server
        run: |
          cp -r public .next/standalone/
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/
          tar -C .next/standalone -czf release.tgz .

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: scp release.tgz "$VPS_USER@$VPS_HOST:/tmp/petivo-$GITHUB_SHA.tgz"

      - name: Activate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "DEPLOY_SHA=$GITHUB_SHA bash -s" <<'REMOTE'
          set -euo pipefail
          release="/var/www/petivo/releases/$DEPLOY_SHA"
          mkdir -p "$release"
          tar -xzf "/tmp/petivo-$DEPLOY_SHA.tgz" -C "$release"
          ln -sfn "$release" /var/www/petivo/current
          rm -f "/tmp/petivo-$DEPLOY_SHA.tgz"
          sudo /usr/bin/systemctl restart petivo

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              find /var/www/petivo/releases -mindepth 1 -maxdepth 1 -type d ! -path "$release" -exec rm -rf -- {} +
              exit 0
            fi
            sleep 1
          done
          exit 1
          REMOTE
